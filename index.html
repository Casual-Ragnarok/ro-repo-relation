          "label": "ro-single-server/README.md"
        },
        {
          "url": "https://github.com/Casual-Ragnarok/ro-single-client/blob/master/README.md",
          "label": "ro-single-client/README.md"
        }
      ]
    }
  ]
}</script><script>
const data=JSON.parse(document.getElementById('repo-data').textContent);
const buckets=data.categories.map(category=>[category.name,category.color,data.nodes.filter(n=>n.diagram_category===category.name).map(n=>n.name)]);
const byName=new Map(data.nodes.map(n=>[n.name,n]));
const edges=data.relations;let selected='',view='全部仓库',query='';const svg=document.getElementById('graph');const NS='http://www.w3.org/2000/svg';
const modeLabels={dependency:'源码 / 资源 / 镜像依赖',artifact:'生成与发布',manual:'人工准备或审核迁移',contract:'客户端与服务端配套',reference:'工具使用参考',navigation:'网站导航'};
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dash(e){return e.mode==='reference'?'3 6':e.mode==='manual'?'8 5':''}
function visible(name){if(view==='全部仓库')return true;if(view==='网站与内容')return byName.get(name)?.diagram_category==='网站与内容';if(view==='Bot 与单机')return ['casual-ro-AI-Bot','openkore','openkore-docker','ro-single-server','ro-single-client'].includes(name);return byName.get(name)?.diagram_category==='客户端与资源'||['casual-ro-server','casual-ro-server-docker','WarpEdition','Nemo','GRFEditor','RagnarokSDE'].includes(name)}
function textLines(s,max=21){const chars=Array.from(s),lines=[];for(let i=0;i<chars.length;i+=max)lines.push(chars.slice(i,i+max).join(''));return lines}
function render(){svg.replaceChildren();const defs=el('defs');const marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#6e8daa'}));defs.append(marker);svg.append(defs);const pos=new Map();let max=0;buckets.forEach(([title,color,names],col)=>{const list=names.filter(visible);if(!list.length)return;const x=24+col*330;svg.append(el('text',{x,y:34,class:'group-title'},title+' · '+list.length));list.forEach((name,i)=>{pos.set(name,{x,y:65+i*132,color});max=Math.max(max,65+i*132+108)})});svg.setAttribute('viewBox',`0 0 1330 ${max+30}`);const related=new Set([selected]);edges.filter(e=>e.source===selected||e.target===selected).forEach(e=>{related.add(e.source);related.add(e.target)});
const matches=name=>!query||(name+' '+byName.get(name).role+' '+byName.get(name).description).toLowerCase().includes(query);
edges.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)return;let x1=a.x+290,y1=a.y+50,x2=b.x,y2=b.y+50,d;if(a.x===b.x){x1=a.x+290;x2=b.x+290;d=`M${x1},${y1} C${x1+25},${y1} ${x2+25},${y2} ${x2},${y2}`}else{if(a.x>b.x){x1=a.x;x2=b.x+290}const mid=(x1+x2)/2;d=`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`}const hot=e.source===selected||e.target===selected;const p=el('path',{d,class:'edge'+(hot?' hot':'')+((selected&&!hot||query&&!matches(e.source)&&!matches(e.target))?' faded':''),'stroke-dasharray':dash(e),'marker-end':'url(#arrow)'});p.append(el('title',{},`${e.source} → ${e.target}：${e.label}`));svg.append(p)});
pos.forEach((p,name)=>{const n=byName.get(name);const g=el('g',{class:'node'+(selected===name?' selected':'')+((selected&&!related.has(name)||!matches(name))?' faded':''),tabindex:0,role:'button','aria-label':name+'，'+n.role});g.append(el('rect',{x:p.x,y:p.y,width:290,height:108,rx:7}));g.append(el('rect',{x:p.x,y:p.y+12,width:3,height:84,style:`fill:${p.color};stroke:none`}));g.append(el('text',{x:p.x+14,y:p.y+27,'font-family':'Consolas,Microsoft YaHei,monospace','font-size':name.length>27?12:14,'font-weight':600,fill:'#20334d'},name));textLines(n.role).forEach((line,i)=>g.append(el('text',{x:p.x+14,y:p.y+51+i*18,'font-size':13,fill:'#60748c'},line)));g.append(el('text',{x:p.x+14,y:p.y+95,'font-size':10,fill:p.color},n.branch_snapshot?'BRANCH / '+n.branch_snapshot:'RESOURCE / HUGGING FACE'));g.append(el('title',{},name+'\n'+n.role));g.onclick=()=>choose(name);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(name)}};svg.append(g)});detail()}
function choose(name){selected=selected===name?'':name;render()}
function evidenceHtml(evidence){return evidence.map(e=>'<div class="source"><a target="_blank" rel="noopener" href="'+esc(e.url)+'">'+esc(e.label)+'</a></div>').join('')}
function repositoryHtml(n){const title=n.repository_url.includes('github.com')?'GitHub 仓库':'远端仓库';return '<p><strong>'+title+'</strong><br><a target="_blank" rel="noopener" href="'+esc(n.repository_url)+'">'+esc(n.repository_url)+'</a></p>'+(n.page?'<p><strong>'+esc(n.page.label)+'</strong><br><a target="_blank" rel="noopener" href="'+esc(n.page.url)+'">'+esc(n.page.url)+'</a>'+(n.page.note?'<br><small>'+esc(n.page.note)+'</small>':'')+'</p>':'')}

function detail(){const box=document.getElementById('detail');if(!selected){box.innerHTML='<div class="tag">RO REPOSITORY MAP</div><h2>按职责找仓库</h2><p>已核对 <strong>'+data.nodes.filter(n=>n.name!=='RO-GRF').length+'</strong> 个本地项目，并收录 RO-GRF 资源仓库。点击节点查看完整功能、远端资料依据和直接关联。</p><p>实线表示依赖、产出、配套或导航；虚线表示人工流转；点线表示工具使用参考。每条连线的具体含义可在节点详情中查看。</p><p>未找到明确关联的仓库保留为独立节点。安装目录、通用运行组件和 REA 内部子模块不纳入图中。</p><p>搜索会淡化不匹配的节点；所有功能说明均以本地 README 为主，必要时由源码或配置补充核对。</p>';return}const n=byName.get(selected);const rel=edges.filter(e=>e.source===selected||e.target===selected);box.innerHTML='<div class="tag">'+esc(n.diagram_category)+'</div><h2>'+esc(selected)+'</h2><p><strong>'+esc(n.role)+'</strong><br>'+esc(n.description)+'</p>'+repositoryHtml(n)+'<details><summary>功能说明依据</summary>'+evidenceHtml(n.evidence)+'</details><h3>直接关系 · '+rel.length+'</h3>'+(rel.length?rel.map(e=>{const out=e.source===selected,other=out?e.target:e.source;return '<div class="relation">'+(out?'流向 → ':'来自 ← ')+'<button data-name="'+esc(other)+'">'+esc(other)+'</button><div>'+esc(e.label)+'</div><small>'+esc(modeLabels[e.mode])+'</small>'+(e.note?'<small>'+esc(e.note)+'</small>':'')+'<details><summary>关系依据</summary>'+evidenceHtml(e.evidence)+'</details></div>'}).join(''):'<p>当前未确认与图内其他仓库的直接关联，不推断部署或构建依赖。</p>');box.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{if(!visible(b.dataset.name)){view='全部仓库';tabs()}choose(b.dataset.name)})}
function tabs(){document.getElementById('tabs').replaceChildren(...['全部仓库','客户端链路','网站与内容','Bot 与单机'].map(v=>{const b=document.createElement('button');b.textContent=v;b.className=view===v?'active':'';b.setAttribute('aria-pressed',view===v);b.onclick=()=>{view=v;selected='';tabs();render()};return b}))}
document.getElementById('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};document.getElementById('reset').onclick=()=>{selected='';query='';document.getElementById('search').value='';render()};document.getElementById('download').onclick=()=>{const copy=svg.cloneNode(true);const styles=el('style',{},document.querySelector('style').textContent);copy.insertBefore(styles,copy.firstChild);copy.setAttribute('width','1330');copy.setAttribute('height',svg.viewBox.baseVal.height);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ro-repositories.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};tabs();render();

</script></body></html>
